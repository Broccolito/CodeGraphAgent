# A GitHub release is a deploy: the desktop updater installs releases/latest of this repository at
# the next launch, with no prompt. Push a tag only after the checks pass and the release has been
# approved. The tag is always v plus manifest.json's version. The engine is upstream CodeGraph's own
# release, pinned in src/codegraphagent/release_manifest.json; this repository publishes no engine
# releases any more (the old engine-v* releases stay for 0.1.0 installs, and were never "latest").
name: Publish BRXT

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - name: Refuse a tag that is not v plus the manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Tag $RELEASE_TAG does not equal v$version from manifest.json" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: The lock matches pyproject.toml
        run: uv lock --check
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run pytest -q
      - name: Fetch the previous release bundle, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "codegraphagent.brxt" --dir previous \
            || echo "No earlier bundle: skipping the bundled skill path check."
      - name: Build
        run: |
          if [ -f previous/codegraphagent.brxt ]; then
            uv run python scripts/build_brxt.py --previous previous/codegraphagent.brxt
          else
            uv run python scripts/build_brxt.py
          fi
      - name: Publish the stable and versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/codegraphagent.brxt "dist/codegraphagent-$VERSION.brxt" dist/SHA256SUMS \
            --title "CodeGraphAgent $RELEASE_TAG" --notes-file CHANGELOG.md --latest

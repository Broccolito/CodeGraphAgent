name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Shim tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - name: The lock matches pyproject.toml
        run: uv lock --check
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run pytest -q

  bundle:
    name: Build the bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - run: uv run --no-project --python 3.12 python scripts/build_brxt.py
      - name: The bundle carries no engine and the notices
        run: |
          unzip -l dist/codegraphagent.brxt
          unzip -l dist/codegraphagent.brxt | grep -q ' LICENSE$'
          unzip -l dist/codegraphagent.brxt | grep -q ' NOTICE$'
          unzip -l dist/codegraphagent.brxt | grep -q ' uv.lock$'
          ! unzip -l dist/codegraphagent.brxt | grep -q '/engine/'
